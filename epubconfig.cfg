\newcommand\HAddFontFace[4]{%
\Css{@font-face {
  font-family: #1;
  src: local("#2"),
    url('#3');
  #4
}}
{\Configure{Needs}{File: #3}\Needs{}}
}

% Define the four Junicode variants
\HAddFontFace{Junicode}{Junicode Regular}{font-weight: normal; font-style: normal;}{fonts/junicode/OTF/Junicode-Regular.otf}

\HAddFontFace{Junicode}{Junicode Bold}{font-weight: bold; font-style: normal;}{fonts/junicode/OTF/Junicode-Bold.otf}

\HAddFontFace{Junicode}{Junicode Italic}{font-weight: normal; font-style: italic;}{fonts/junicode/OTF/Junicode-Italic.otf}

\HAddFontFace{Junicode}{Junicode Bold Italic}{font-weight: bold; font-style: italic;}{fonts/junicode/OTF/Junicode-BoldItalic.otf}

% Apply Junicode and force tex4ht to stop resizing styled text
\Css{body { font-family: 'Junicode', serif; }}
\Css{em, i, strong, b { font-size: inherit !important; font-family: 'Junicode', serif; }}

% Override tex4ht's auto-generated font-size classes for italics and bold
\Css{span.textit, span.textbf, span.textsl { font-size: inherit !important; }}

\title{The Northern Epics}
\Configure{TITLE+}{The Northern Epics}
\author{Konrad O. L. Rosenberg}

